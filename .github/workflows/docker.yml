name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  # Определяем, затронуты ли реальные компоненты образа.
  # Фильтр вынесен в отдельную job, а не в on.push.paths: так теги
  # гарантированно собираются всегда, независимо от содержимого коммита.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -uo pipefail

          emit() {
            {
              echo "backend=$1"
              echo "frontend=$2"
              echo "build=$3"
            } >> "$GITHUB_OUTPUT"
            echo "backend=$1 frontend=$2 build=$3"
          }

          if [ "$REF_TYPE" = "tag" ]; then
            echo "Пуш тега — релизная сборка выполняется всегда."
            emit true true true
            exit 0
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Базовый коммит недоступен (первый пуш или force-push) — собираем."
            emit true true true
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$CURRENT")"
          echo "Изменённые файлы:"
          echo "$changed" | sed 's/^/  /'

          backend=false
          frontend=false
          shared=false
          if echo "$changed" | grep -Eq '^backend/'; then backend=true; fi
          if echo "$changed" | grep -Eq '^frontend/'; then frontend=true; fi
          if echo "$changed" | grep -Eq '^(Dockerfile|\.dockerignore|\.github/workflows/docker\.yml)$'; then shared=true; fi

          build=false
          if [ "$backend" = true ] || [ "$frontend" = true ] || [ "$shared" = true ]; then build=true; fi

          emit "$backend" "$frontend" "$build"

      - name: Report decision
        shell: bash
        run: |
          {
            echo "### Изменённые компоненты"
            echo ""
            echo "| Компонент | Затронут |"
            echo "|---|---|"
            echo "| backend  | ${{ steps.filter.outputs.backend }} |"
            echo "| frontend | ${{ steps.filter.outputs.frontend }} |"
            echo ""
            if [ "${{ steps.filter.outputs.build }}" = "true" ]; then
              echo "Образ пересобирается."
            else
              echo "Изменения не затрагивают образ — сборка пропущена."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/duty-schedule
        tags: |
          # Тег latest для основной ветки
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

          # Теги для версий
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

          # Тег для ветки main (без префикса)
          type=ref,event=branch

          # Тег с SHA (только для не-main веток)
          type=sha,prefix={{branch}}-,enable=${{ github.ref != 'refs/heads/main' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
