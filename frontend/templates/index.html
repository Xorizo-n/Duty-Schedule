<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>График дежурств</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body>
    <div class="background-animation" aria-hidden="true">
        <div class="background-scene"></div>
        <div class="background-scene"></div>
    </div>

    <div class="container-tv">
        <div class="today-section glass-effect">
            <div class="today-date">
                Сегодня: <span id="today-date">--.--.----</span>
                <span class="time-separator">|</span>
                <span id="current-time">--:--:--</span>
            </div>
            <div id="today-duty-container">
                <div class="no-duty">Загрузка данных...</div>
            </div>
        </div>

        <div class="schedule-section glass-effect" id="schedule-container">
            <div class="text-center text-muted py-4">Загрузка расписания...</div>
        </div>

        <div class="last-updated glass-effect">
            Обновлено: <span id="last-updated-time">--:--:--</span>
        </div>

        <a class="settings-link" href="/settings" title="Настройки" aria-label="Настройки">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
                <path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-3.8l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.6h3.8l.4-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6z"/>
            </svg>
        </a>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
</body>
</html>
