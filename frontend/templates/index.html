<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>График дежурств</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body>
    <div class="background-animation" aria-hidden="true">
        <div class="background-scene"></div>
        <div class="background-scene"></div>
    </div>

    <div class="container-tv">
        <div class="today-section glass-effect">
            <div class="today-date">
                Сегодня: <span id="today-date">--.--.----</span>
                <span class="time-separator">|</span>
                <span id="current-time">--:--:--</span>
            </div>
            <div id="today-duty-container">
                <div class="no-duty">Загрузка данных...</div>
            </div>
        </div>

        <div class="schedule-section glass-effect" id="schedule-container">
            <div class="text-center text-muted py-4">Загрузка расписания...</div>
        </div>

        <div class="last-updated glass-effect">
            Обновлено: <span id="last-updated-time">--:--:--</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
</body>
</html>
