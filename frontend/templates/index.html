<!DOCTYPE html>
<html lang="ru" class="board-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>График дежурств</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body class="board-page">
    <div class="background-animation" aria-hidden="true">
        <div class="background-scene"></div>
        <div class="background-scene"></div>
    </div>

    <main class="board">
        <header class="hero panel">
            <div class="hero-clock">
                <div class="clock"><span id="clock-hm">--:--</span><span class="clock-sec" id="clock-sec">:--</span></div>
                <div class="hero-date" id="hero-date">&nbsp;</div>
            </div>
            <div class="hero-duty" id="hero-duty">
                <div class="hero-message">Загрузка данных…</div>
            </div>
        </header>

        <section class="schedule" id="schedule" aria-label="График дежурств на две недели">
            <div class="schedule-message panel">Загрузка расписания…</div>
        </section>

        <footer class="status" id="status" data-state="loading">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Загрузка…</span>
        </footer>

        <a class="settings-link" href="/settings" title="Настройки" aria-label="Настройки">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
                <path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-3.8l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.6h3.8l.4-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6z"/>
            </svg>
        </a>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
</body>
</html>
